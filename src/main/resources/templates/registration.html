<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | TestCraft AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: url('/images/background-shapes.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #fff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            margin: 5rem auto;
        }

        .ai-logo {
            font-weight: bold;
            color: #65d794;
            font-size: 2rem;
        }

        .btn-primary-custom {
            background-color: #1e4b6d;
            color: white;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #1e4b6d;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <span style="color:#1e4b6d">Test</span><span class="ai-logo">AI</span>
        </a>
        <div class="collapse navbar-collapse justify-content-center">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/generate}">Generate</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/flashcards}">Flashcards</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/library}">Your library</a></li>
            </ul>
        </div>
        <div class="d-flex">
            <a class="nav-link" th:href="@{/registraion}">Sign up</a>
            <a class="btn btn-primary btn-sm ms-2" th:href="@{/login}">Log in</a>
        </div>
    </div>
</nav>

<!-- Sign Up Form -->
<div class="form-container text-center">
    <h4 class="mb-3">Create your account</h4>
    <p class="text-muted mb-4">Please enter an email and password you would like to use</p>
    <form th:action="@{/registration/save}" method="post">
        <div class="mb-3 text-start">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="username" required>
        </div>
        <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="mb-3 text-start">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="mb-4 text-start">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <button type="submit" class="btn btn-primary-custom w-100">Sign up</button>
    </form>
    <p class="mt-3 text-muted">Already have an account? <a th:href="@{/login}">Sign in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
