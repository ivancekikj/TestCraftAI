<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .btn-download {
            background-color: #58e58e;
            border: none;
        }
        .btn-view {
            background-color: #1b4f72;
            color: white;
        }
        .btn-view:hover {
            background-color: #145a7a;
        }
        .top-nav {
            padding: 1rem 2rem;
        }
    </style>
</head>
<body>
<nav class="d-flex justify-content-between align-items-center top-nav border-bottom">
    <div class="fw-bold fs-4">
        <span>Test</span><span style="color:#00cc66">Craft<span style="color:#0099cc">AI</span></span>
    </div>
    <div>
        <a href="#" class="me-3 text-decoration-none text-dark">Home</a>
        <a href="#" class="me-3 text-decoration-none text-dark">Generate</a>
        <a href="#" class="me-3 text-decoration-none text-dark">Flashcards</a>
        <a href="#" class="me-4 text-decoration-none text-dark">Your library</a>
        <a href="/signup" class="me-2 text-decoration-none">Sign up</a>
        <a href="/login" class="btn btn-dark btn-sm">Log in</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Your Library</h2>

    <div class="mb-4">
        <h5>Recent Tests</h5>
        <div th:each="test : ${recentTests}" class="d-flex justify-content-between align-items-center mb-2 border p-2 rounded">
            <div th:text="${test.title} + ' - ' + ${test.date}">Chapter 3 Quiz - 2024-10-26</div>
            <button class="btn btn-download btn-sm">Download/Export</button>
        </div>
    </div>

    <div class="mb-5">
        <h5>My uploaded materials</h5>
        <div th:each="material : ${uploadedMaterials}" class="d-flex justify-content-between align-items-center mb-2 border p-2 rounded">
            <div th:text="${material.name}">Lecture Notes - Chapter 3.pdf</div>
            <a th:href="@{/materials/view/{id}(id=${material.id})}" class="btn btn-view btn-sm">View</a>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-3">
        <a href="/generate-test" class="btn btn-dark">Generate new test</a>
        <a href="/generate-flashcard" class="btn btn-dark">Generate new flashcard</a>
        <!-- Upload Button triggers Modal -->
        <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#uploadModal">
            Upload new materials
        </button>
    </div>
</div>

<!-- Upload Modal -->
<div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Upload Material</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="file" class="form-label">Choose file</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Upload</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
