<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login | TestCraft AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: url('/images/background-shapes.svg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      margin: 0;
    }

    .form-container {
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      margin: 5rem auto;
    }

    .ai-logo {
      font-weight: bold;
      color: #65d794;
      font-size: 2rem;
    }

    .btn-primary-custom {
      background-color: #1e4b6d;
      color: white;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #1e4b6d;
    }

    a.forgot-link {
      font-size: 0.9rem;
      float: right;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <span style="color:#1e4b6d">Test</span><span class="ai-logo">AI</span>
    </a>
    <div class="collapse navbar-collapse justify-content-center">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/generate}">Generate</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/flashcards}">Flashcards</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/library}">Your library</a></li>
      </ul>
    </div>
    <div class="d-flex">
      <a class="nav-link" th:href="@{/signup}">Sign up</a>
      <a class="btn btn-primary btn-sm ms-2" th:href="@{/login}">Log in</a>
    </div>
  </div>
</nav>

<!-- Login Form -->
<div class="form-container text-center">
  <h4 class="mb-3">Login to your account</h4>
  <p class="text-muted mb-4">Please enter your email and password to continue</p>
  <form th:action="@{/login}" method="post">
    <div class="mb-3 text-start">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
    </div>
    <div class="mb-3 text-start">
      <label for="password" class="form-label">Password
        <a th:href="@{/forgot-password}" class="forgot-link">Forgot Password?</a>
      </label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3 text-start form-check">
      <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
      <label class="form-check-label" for="rememberMe">Remember Password</label>
    </div>
    <button type="submit" class="btn btn-primary-custom w-100">Sign In</button>
  </form>
  <p class="mt-3 text-muted">Don’t have an account? <a th:href="@{/signup}">Create Account</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
